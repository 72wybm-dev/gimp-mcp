[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gimp-mcp"
version = "0.2.0"
description = "Model Context Protocol server and GIMP bridge for controlling GIMP through its PDB."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GIMP MCP contributors" }]

[project.scripts]
gimp-mcp = "gimp_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
